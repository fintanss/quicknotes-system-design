<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QuickNotes API client for creating and managing notes.">
    <title>QuickNotes - Notes Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1>QuickNotes</h1>
        <p>Your notes, connected to an API.</p>
    </header>

    <main class="container">
        <section class="panel">
            <h2>Your Notes</h2>
            <p>Load sample notes from the server to get started.</p>

            <button type="button" id="load-btn">Load notes</button>
            <p id="status" role="status" aria-live="polite"></p>

            <form id="note-form">
                <h2>Create a Note</h2>

                <label for="title-input">Note title (required)</label>
                <input
                    type="text"
                    id="title-input"
                    name="title"
                    maxlength="100"
                    required
                >

                <label for="body-input">Note body (optional)</label>
                <textarea
                    id="body-input"
                    name="body"
                    rows="4"
                ></textarea>

                <button type="submit" id="submit-btn">Create note</button>
            </form>
        </section>

        <section class="notes-section">
            <h2>Notes List</h2>
            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>QuickNotes System Design Project</p>
    </footer>
</body>
</html>
